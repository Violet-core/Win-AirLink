<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Win-AirLink</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect x=%221%22 y=%221%22 width=%2210%22 height=%2210%22 fill=%22%230078D4%22/><rect x=%2213%22 y=%221%22 width=%2210%22 height=%2210%22 fill=%22%230078D4%22/><rect x=%221%22 y=%2213%22 width=%2210%22 height=%2210%22 fill=%22%230078D4%22/><rect x=%2213%22 y=%2213%22 width=%2210%22 height=%2210%22 fill=%22%230078D4%22/></svg>">
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a3040;--text:#e7eaf0;--muted:#8b94a5;--accent:#4f8cff;--green:#107c10}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--text);background-color:var(--bg);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden}

  /* Мягкая подсветка граней и плавные состояния интерфейса */
  button,input[type=text],code,.panel,.devices,header,.drop,.chip,.msg,.file-item,.msg-form{
    transition:border-color .32s ease,box-shadow .38s ease,background-color .32s ease,transform .32s cubic-bezier(.2,.7,.2,1)
  }
  header:hover,.devices:hover,.panel:hover,.msg-form:focus-within{
    border-color:rgba(103,160,255,.42);box-shadow:0 0 0 1px rgba(103,160,255,.09),0 8px 28px rgba(37,104,210,.075),0 0 24px rgba(79,140,255,.045)
  }
  button:focus-visible,input:focus-visible,.file-name:focus-visible{outline:2px solid rgba(112,177,255,.85);outline-offset:2px}
  button:hover{border-color:rgba(112,170,255,.55);box-shadow:0 0 0 1px rgba(104,165,255,.15),0 0 18px rgba(79,140,255,.11);transform:translateY(-1px)}
  button:active{transform:translateY(0) scale(.98)}
  input[type=text]:hover,code:hover{border-color:rgba(112,170,255,.42);box-shadow:0 0 14px rgba(79,140,255,.07)}
  .chip:hover,.msg:hover{border-color:rgba(105,160,255,.48);box-shadow:0 0 16px rgba(79,140,255,.10)}
  .drop{box-shadow:inset 0 0 0 1px rgba(110,160,255,.025)}
  .drop:hover,.drop:focus-within{border-color:rgba(95,151,255,.58);box-shadow:inset 0 0 24px rgba(79,140,255,.055),0 0 18px rgba(79,140,255,.075)}
  .panel{animation:panelEnter .55s cubic-bezier(.2,.7,.2,1) both}
  @keyframes panelEnter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
  .file-item{animation:itemEnter .28s ease both}
  @keyframes itemEnter{from{opacity:0;transform:translateY(9px) scale(.992);filter:blur(2px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

  /* Плавный анимированный фон */
  .bg-glow{position:fixed;border-radius:50%;filter:blur(100px);opacity:0.15;pointer-events:none;z-index:0;
    animation:floatBg 18s infinite alternate ease-in-out}
  .bg-glow-1{width:600px;height:600px;background:#4f8cff;top:-10%;left:-10%}
  .bg-glow-2{width:500px;height:500px;background:#38d39f;bottom:-10%;right:-10%;animation-delay:-6s}
  .bg-glow-3{width:400px;height:400px;background:#2f5da3;top:40%;left:40%;animation-delay:-12s}
  @keyframes floatBg{
    0%{transform:translate(0,0) scale(1)}
    50%{transform:translate(60px,80px) scale(1.1)}
    100%{transform:translate(-40px,50px) scale(0.95)}
  }

  .app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;height:100dvh}

  header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;flex:0 0 auto}
  .brand{font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .brand svg{flex-shrink:0}
  .server-url,.me{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .server-url code{max-width:52vw;overflow:auto;white-space:nowrap}
  code{background:#0b0e13;border:1px solid var(--line);padding:3px 8px;border-radius:7px;
    color:#9ec1ff;font-size:13px;font-family:ui-monospace,Consolas,monospace}
  input[type=text]{background:#0b0e13;border:1px solid var(--line);color:var(--text);
    padding:8px 11px;border-radius:9px;font:inherit;outline:none;min-width:0}
  input[type=text]:focus{border-color:var(--accent)}
  button{cursor:pointer;font:inherit;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);padding:7px 12px;transition:.15s}
  button:hover{background:#262c38}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.08)}

  .devices{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;font-size:12px;color:var(--muted);flex:0 0 auto}
  .devices .lbl{text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:11px}
  .device-list{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:4px 10px;color:var(--text);font-size:12px;white-space:nowrap}
  .chip.me{border-color:var(--accent);background:#18284a;color:#cfe0ff}

  .banner{background:#3a1d22;border:1px solid #7a3040;color:#ffd7dd;padding:10px 12px;border-radius:12px;font-size:13px}

  main{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1 1 auto;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  
  /* Шапка панели Загрузок */
  .panel>h2{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);border-bottom:1px solid var(--line);font-weight:600;position:relative;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .h2-left{flex:1;min-width:0;display:flex;align-items:center;gap:6px;justify-content:flex-start}
  
  .trash-btn{flex:0 0 auto;background:#b91c1c;border:1px solid #7f1d1d;color:#fff;
    width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    padding:0;transition:.15s}
  .trash-btn:hover{background:#dc2626}
  .trash-btn:disabled{opacity:.35;cursor:not-allowed;background:#3a1d22;border-color:#4a1d24}

  .h2-pct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
    color:var(--accent);font-weight:700;font-size:13px;letter-spacing:0;text-transform:none;
    pointer-events:none}
  .h2-pct[hidden]{display:none}
  .pct-dash{color:var(--line);font-weight:400;letter-spacing:-1px}

  .messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
  .msg{max-width:82%;align-self:flex-start;background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:7px 10px 5px;font-size:14px;overflow-wrap:anywhere;display:flex;flex-direction:column}
  .msg.mine{align-self:flex-end;background:#22406f;border-color:#2f5da3}
  .msg-head{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
  .msg-head b{font-size:12px;font-weight:600;color:#9db4e0}
  .msg.mine .msg-head b{color:#cfe0ff}
  .msg-head .time{font-size:11px;color:#7b8494;margin-left:auto}
  .msg-text{white-space:pre-wrap}
  
  .msg-footer{display:flex;justify-content:flex-end;margin-top:4px}
  .msg-copy{background:transparent;border:none;color:#7b8494;cursor:pointer;padding:2px 4px;
    font-size:11px;border-radius:5px;opacity:0.5;transition:.15s;line-height:1;display:flex;align-items:center;gap:4px}
  .msg-copy:hover{opacity:1;background:rgba(255,255,255,0.08)}
  .msg-copy.copied{color:#38d39f;opacity:1}
  .msg-delete{background:transparent;border:0;color:#d58a92;cursor:pointer;padding:2px 4px;
    font-size:13px;line-height:1;border-radius:5px;opacity:.48;transition:opacity .2s,background .2s,color .2s}
  .msg-delete:hover{opacity:1;color:#ff8794;background:rgba(255,80,100,.12)}
  .msg-footer{gap:5px}

  .msg-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
  .msg-form input{flex:1}

  /* Drop Zone */
  .drop{margin:10px;border:2px dashed #2c3446;border-radius:12px;padding:14px;text-align:center;
    color:var(--muted);font-size:14px;transition:.15s}
  .drop.over{border-color:var(--accent);background:#16203a;color:#c7d8ff}
  .drop-hint{margin:0 0 10px;color:var(--muted);font-size:13px}
  .pick-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .pick-row button{padding:10px 16px;font-size:14px}
  .pick-hint{margin-top:10px;font-size:11px;color:#5d6678;line-height:1.4}
  .prog{font-size:12px;color:#9ec1ff;min-height:0;margin-top:10px;overflow-wrap:anywhere;text-align:left}

  /* Список файлов */
  .file-list{list-style:none;margin:0;padding:0 10px 10px;overflow-y:auto;flex:1;
    display:flex;flex-direction:column;gap:8px;min-height:0}
  
  .file-item{display:flex;align-items:center;gap:10px;background:var(--panel2);
    border:1px solid var(--line);border-radius:11px;padding:8px 10px;position:relative;
    transition:border-color .48s ease,box-shadow .55s ease,transform .48s cubic-bezier(.2,.7,.2,1),background-color .48s ease}
  
  /* Современный эффект при наведении */
  .file-item:hover{
    border-color:#4f8cff;
    box-shadow:0 4px 15px rgba(79,140,255,0.15), 0 0 0 1px rgba(79,140,255,0.2) inset;
    transform:translateY(-1px)
  }

  /* Свечение при завершении */
  .file-item.just-ready{
    animation:glowUp 3s cubic-bezier(0.4, 0, 0.2, 1) forwards
  }
  @keyframes glowUp{
    0% { box-shadow: 0 0 0px rgba(79,140,255,0); border-color: var(--line); }
    20% { box-shadow: 0 0 18px rgba(79,140,255,0.6), 0 0 30px rgba(56,211,159,0.4); border-color: #4f8cff; }
    100% { box-shadow: 0 0 0px rgba(79,140,255,0); border-color: var(--line); }
  }

  .file-thumb-wrap{position:relative;width:56px;height:56px;flex-shrink:0;border-radius:8px;
    overflow:hidden;background:#0b0e13;border:1px solid var(--line)}
  .file-thumb-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .file-thumb-layer img,.file-thumb-layer video{width:100%;height:100%;object-fit:cover;display:block}
  .file-thumb-layer .emoji{font-size:28px;line-height:1}
  .file-thumb-layer .play-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.85);pointer-events:none}
  
  .file-thumb-grey{position:absolute;inset:0;
    background:rgba(8,11,16,0.78);
    clip-path:inset(0 0 0 var(--progress, 0%));
    transition:clip-path .65s cubic-bezier(.22,.61,.36,1);pointer-events:none;z-index:3}

  .file-item.uploading::after{content:'';position:absolute;inset:0;border-radius:11px;
    background:rgba(8,11,16,0.42);
    clip-path:inset(0 0 0 var(--progress, 0%));
    transition:clip-path .65s cubic-bezier(.22,.61,.36,1);pointer-events:none;z-index:4}
  .file-item.uploading > *{position:relative;z-index:5}

  .file-meta{flex:1;min-width:0}
  .file-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:var(--text);text-decoration:none;display:block}
  .file-name.link{cursor:pointer}
  .file-name.link:hover{color:#9ec1ff}
  .file-sub{font-size:12px;color:var(--muted)}

  .upload-pct{flex:0 0 auto;background:rgba(79,140,255,0.92);color:#fff;
    padding:4px 9px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap;
    font-variant-numeric:tabular-nums;z-index:5;position:relative}

  .btn-dl,.btn-del{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
    border-radius:9px;border:1px solid var(--line);background:#12161d;color:var(--text);
    text-decoration:none;font-size:16px;flex:0 0 auto;transition:.15s}
  .btn-dl:hover{background:#1d3a2b;border-color:#2f6b4d}
  .btn-del:hover{background:#3a1d22;border-color:#7a3040}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:16px}

  .version{position:fixed;bottom:6px;right:10px;font-size:11px;color:#5d6678;
    pointer-events:none;user-select:none;z-index:100}

  @media (max-width:820px){
    .app{height:auto;min-height:100dvh;padding:10px}
    main{grid-template-columns:1fr}
    .messages{height:42vh;flex:none}
    .file-list{max-height:40vh}
    .server-url code{max-width:46vw}
    .version{bottom:4px;right:8px}
  }
</style>
</head>
<body>

<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-glow bg-glow-3"></div>

<div class="app">

  <div id="banner" class="banner" hidden></div>

  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0078D4"/>
            <stop offset="100%" stop-color="#00B7FF"/>
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="10" height="10" fill="url(#winGrad)" rx="0.6"/>
        <rect x="13" y="1" width="10" height="10" fill="url(#winGrad)" rx="0.6"/>
        <rect x="1" y="13" width="10" height="10" fill="url(#winGrad)" rx="0.6"/>
        <rect x="13" y="13" width="10" height="10" fill="url(#winGrad)" rx="0.6"/>
      </svg>
      Win-AirLink
    </div>
    <div class="server-url">
      <span>Для телефона:</span>
      <code id="serverAddr">…</code>
      <button id="copyAddr" type="button" title="Скопировать локальный адрес для подключения" aria-label="Скопировать локальный адрес">📋</button>
      <button id="showQr" type="button" title="Открыть QR-код подключения" aria-label="Открыть QR-код">▦ QR</button>
    </div>
    <div class="me">
      <span>Вы:</span>
      <code id="myIp">…</code>
      <input id="nameInput" type="text" placeholder="Имя" maxlength="24" style="width:130px">
    </div>
  </header>

  <div class="devices">
    <span class="lbl">В сети</span>
    <div id="deviceList" class="device-list"><span class="chip">поиск…</span></div>
  </div>

  <main>
    <section class="panel">
      <h2>
        <span>Сообщения</span>
        <button id="clearChat" class="trash-btn" title="Очистить весь чат" type="button" disabled aria-label="Очистить весь чат">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M5.5 1a.5.5 0 0 0-.5.5V2H2.5a.5.5 0 0 0 0 1h.6l.6 9.1A1.5 1.5 0 0 0 5.2 13.5h5.6a1.5 1.5 0 0 0 1.5-1.4l.6-9.1h.6a.5.5 0 0 0 0-1H11V1.5a.5.5 0 0 0-.5-.5h-5ZM6 2h4v1H6V2Zm-.9 2h5.8l-.5 8H5.6l-.5-8Z"/>
          </svg>
        </button>
      </h2>
      <div id="messages" class="messages"></div>
      <form id="msgForm" class="msg-form" autocomplete="off">
        <input id="msgInput" type="text" placeholder="Сообщение…" maxlength="2000">
        <button type="submit" class="primary">➤</button>
      </form>
    </section>

    <section class="panel">
      <h2>
        <div class="h2-left">
          <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="7.5" fill="#107c10"/>
            <path d="M8 4 L8 9 M5.5 7 L8 9.5 L10.5 7 M4.5 11.5 L11.5 11.5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>ЗАГРУЗКИ</span>
          <span id="fileCount"></span>
        </div>

<div id="uploadPct" class="h2-pct" hidden>
          <span class="pct-dash">— —</span> получение <span id="pctVal">0%</span> <span class="pct-dash">— —</span>
        </div>

        <button id="trashAll" class="trash-btn" title="Удалить все файлы" type="button" disabled>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M5.5 1a.5.5 0 0 0-.5.5V2H2.5a.5.5 0 0 0 0 1h.6l.6 9.1A1.5 1.5 0 0 0 5.2 13.5h5.6a1.5 1.5 0 0 0 1.5-1.4l.6-9.1h.6a.5.5 0 0 0 0-1H11V1.5a.5.5 0 0 0-.5-.5h-5ZM6 2V2h4H6Zm-.9 2h5.8l-.5 8H5.6l-.5-8Z"/>
          </svg>
        </button></h2>

      <div id="drop" class="drop">
        <p class="drop-hint">Перетащите файлы сюда или:</p>
        <div class="pick-row">
          <button id="pickPhotos" type="button" class="primary">📷 Фото и видео</button>
          <button id="pickFiles" type="button">📁 Любые файлы</button>
        </div>
        <input type="file" id="inputPhotos" accept="image/*,video/*" multiple hidden>
        <input type="file" id="inputFiles" multiple hidden>
        <p class="pick-hint">
          На телефоне «Фото и видео» открывает галерею, «Любые файлы» — файловый менеджер.<br>
          На Windows фильтр работает, начальная папка — последняя использованная.
        </p>
        <div id="sendProgress" class="prog"></div>
      </div>

      <ul id="fileList" class="file-list"></ul>
    </section>
  </main>
</div>

<div class="version">v1.0</div>

<script>
(function () {
  'use strict';

  if (location.protocol === 'file:') {
    document.body.innerHTML =
      '<div style="padding:30px;max-width:560px;margin:60px auto;background:#2a1a1a;' +
      'border:1px solid #7a3040;border-radius:14px;color:#ffd7dd;font:15px/1.5 system-ui,sans-serif">' +
      '<h2 style="margin:0 0 10px">⚠ Откройте через сервер</h2>' +
      '<p>Запустите <b>start.bat</b> — браузер откроется автоматически по адресу ' +
      '<code>http://localhost:3000</code>.</p></div>';
    return;
  }

  const $ = (s) => document.querySelector(s);

  const state = {
    clientId: localStorage.getItem('lm_cid') || (() => {
      const v = 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('lm_cid', v);
      return v;
    })(),
    name: localStorage.getItem('lm_name') || '',
    lastSeq: 0,
    messagesHash: '',
    filesHash: '',
    online: false,
    knownFiles: new Map()
  };
  const qs = () => 'clientId=' + encodeURIComponent(state.clientId) + '&name=' + encodeURIComponent(state.name);

  /* ---------- звуки ---------- */
  let audioCtx = null;
  let audioUnlocked = false;

  function unlockAudio(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audioUnlocked = true;
    } catch(e) {}
  }
  ['pointerdown','keydown','touchstart'].forEach(eventName => {
    window.addEventListener(eventName, unlockAudio, { once:true, passive:true });
  });

  function playSound(type){
    try {
      if (!audioCtx || !audioUnlocked || audioCtx.state !== 'running') return;
      const now = audioCtx.currentTime;
      const master = audioCtx.createGain();
      master.gain.setValueAtTime(0.0001, now);
      master.gain.linearRampToValueAtTime(0.17, now + 0.025);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);
      master.connect(audioCtx.destination);

      const sounds = {
        'file-start':    [{f:523.25,t:0,d:.22,w:'sine',v:.55},{f:659.25,t:.075,d:.25,w:'sine',v:.35}],
        'file-complete': [{f:659.25,t:0,d:.30,w:'sine',v:.45},{f:783.99,t:.12,d:.34,w:'sine',v:.48},{f:987.77,t:.24,d:.42,w:'sine',v:.35}],
        'notification':  [{f:880,t:0,d:.22,w:'sine',v:.38},{f:1174.66,t:.13,d:.30,w:'sine',v:.32}],
        'send':          [{f:587.33,t:0,d:.13,w:'sine',v:.30},{f:783.99,t:.055,d:.16,w:'sine',v:.25}]
      };
      const notes = sounds[type] || sounds.notification;
      const duration = Math.max(...notes.map(n => n.t+n.d));
      master.gain.setTargetAtTime(.0001, now + duration, .08);

      for (const note of notes){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = note.w;
        osc.frequency.setValueAtTime(note.f, now + note.t);
        gain.gain.setValueAtTime(.0001, now + note.t);
        gain.gain.linearRampToValueAtTime(note.v, now + note.t + .025);
        gain.gain.exponentialRampToValueAtTime(.0001, now + note.t + note.d);
        osc.connect(gain);
        gain.connect(master);
        osc.start(now + note.t);
        osc.stop(now + note.t + note.d + .02);
      }
    } catch(e) {}
  }

  /* ---------- утилиты ---------- */
  function fmtTime(ts){ return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
  function fmtSize(b){
    if (b < 1024) return b + ' Б';
    if (b < 1048576) return (b/1024).toFixed(1) + ' КБ';
    if (b < 1073741824) return (b/1048576).toFixed(1) + ' МБ';
    return (b/1073741824).toFixed(2) + ' ГБ';
  }
  async function copyText(t){
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return new Promise((res, rej) => {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); res(); } catch(e){ rej(e); }
      ta.remove();
    });
  }

  function getFileIcon(name, mime) {
    const ext = (name.split('.').pop() || '').toLowerCase();
    const m = (mime || '').toLowerCase();
    if (['blend','blend1','blend2','3ds','max','obj','fbx','stl','dae','glb','gltf','usd','usdz','ply','abc','c4d','ma','mb','unity','asset','prefab'].includes(ext)) return '🧊';
    if (['psd','psb','ai','xd','cdr','sketch','fig','afdesign','afphoto','xcf','indd','kra'].includes(ext)) return '🎨';
    if (m.startsWith('image/') || ['jpg','jpeg','png','gif','webp','bmp','ico','tif','tiff','heic','heif','svg','avif','jfif'].includes(ext)) return '🖼️';
    if (m.startsWith('video/') || ['mp4','webm','mkv','mov','avi','wmv','flv','m4v','3gp','mpg','mpeg','ogv','ts','mts'].includes(ext)) return '🎬';
    if (m.startsWith('audio/') || ['mp3','wav','ogg','flac','m4a','aac','wma','opus','aiff','ape','alac','mid','midi'].includes(ext)) return '🎵';
    if (ext === 'pdf') return '📕';
    if (['doc','docx','odt','rtf','pages','wpd'].includes(ext)) return '📘';
    if (['xls','xlsx','ods','csv','numbers','tsv'].includes(ext)) return '📗';
    if (['ppt','pptx','odp','key'].includes(ext)) return '📙';
    if (['txt','md','log','nfo','readme','markdown'].includes(ext)) return '📝';
    if (['epub','mobi','azw','azw3','fb2','djvu','cbz','cbr'].includes(ext)) return '📖';
    if (['zip','rar','7z','tar','gz','bz2','xz','iso','dmg','zst','lz','tgz','cab'].includes(ext)) return '🗜️';
    if (['js','ts','jsx','tsx','py','rb','php','java','c','cpp','cc','cxx','h','hpp','cs','go','rs','swift','kt','kts','scala','html','htm','css','scss','sass','less','json','xml','yml','yaml','toml','ini','cfg','conf','sh','bat','ps1','lua','pl','r','sql','vue','svelte'].includes(ext)) return '📜';
    if (['exe','msi','com','app','apk','ipa','deb','rpm','appimage','snap','flatpak'].includes(ext)) return '⚙️';
    if (['ttf','otf','woff','woff2','eot','fon','fnt'].includes(ext)) return '🔤';
    if (['torrent','magnet'].includes(ext)) return '🌐';
    if (['db','sqlite','sqlite3','mdb','accdb','dbf'].includes(ext)) return '🗄️';
    if (['img','vhd','vhdx','vmdk','vdi','qcow2'].includes(ext)) return '💿';
    return '📄';
  }

  let pollingMsgs = false;
  let messagesInitialized = false;
  async function pollMessages(){
    if (pollingMsgs) return;
    pollingMsgs = true;
    try {
      const r = await fetch('/api/messages?' + qs(), { cache: 'no-store' });
      if (!r.ok) return;
      const list = await r.json();
      const hash = JSON.stringify(list.map(m => [m.seq, m.clientId, m.name, m.text, m.time]));
      if (hash !== state.messagesHash){
        const previousLastSeq = state.lastSeq;
        const incoming = list.some(m => m.seq > previousLastSeq && m.clientId !== state.clientId);
        const mine = list.some(m => m.seq > previousLastSeq && m.clientId === state.clientId);
        $('#messages').replaceChildren();
        for (const m of list) addMessageEl(m);
        state.messagesHash = hash;
        if (list.length) state.lastSeq = Math.max(state.lastSeq, ...list.map(m => m.seq));
        if (messagesInitialized && incoming) playSound('notification');
        messagesInitialized = true;
        scrollBottomIfNeeded(mine);
      } else {
        messagesInitialized = true;
      }
      $('#clearChat').disabled = list.length === 0;
    } catch (e) {}
    finally { pollingMsgs = false; }
  }

  /* ---------- файлы ---------- */
  function makeThumb(f){
    const wrap = document.createElement('div');
    wrap.className = 'file-thumb-wrap';

    const layer = document.createElement('div');
    layer.className = 'file-thumb-layer';

    const grey = document.createElement('div');
    grey.className = 'file-thumb-grey';

    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const mime = (f.mime || '').toLowerCase();
    const isImage = mime.startsWith('image/') || ['jpg','jpeg','png','gif','webp','bmp','ico','svg','avif','jfif'].includes(ext);
    const isVideo = mime.startsWith('video/') || ['mp4','webm','mkv','mov','m4v','ogv'].includes(ext);

    const fallback = () => {
      layer.innerHTML = '<span class="emoji">' + getFileIcon(f.name, f.mime) + '</span>';
    };

    if (f.status === 'ready' && isImage){
      const img = document.createElement('img');
      img.src = '/api/preview/' + encodeURIComponent(f.id) + '?t=' + (f.time || Date.now());
      img.loading = 'lazy';
      img.alt = '';
      img.onerror = fallback;
      layer.appendChild(img);
    } else if (f.status === 'ready' && isVideo && f.size < 500 * 1024 * 1024){
      const video = document.createElement('video');
      video.src = '/api/preview/' + encodeURIComponent(f.id) + '?t=' + (f.time || Date.now());
      video.preload = 'metadata';
      video.muted = true;
      video.playsInline = true;
      video.onerror = fallback;
      video.addEventListener('loadedmetadata', () => {
        try {
          if (Number.isFinite(video.duration) && video.duration > 0.15) {
            video.currentTime = Math.min(0.5, video.duration / 2);
          }
        } catch (e) {}
      });
      video.addEventListener('loadeddata', () => { try { video.pause(); } catch (e) {} });
      layer.appendChild(video);
      const play = document.createElement('div');
      play.className = 'play-ov'; play.textContent = '▶';
      layer.appendChild(play);
    } else {
      layer.innerHTML = '<span class="emoji">' + getFileIcon(f.name, f.mime) + '</span>';
    }

    wrap.append(layer, grey);
    return wrap;
  }

  async function revealFile(id, fileName, downloadAlreadyStarted = false){
    try {
      const r = await fetch('/api/reveal/' + encodeURIComponent(id), { method:'POST' });
      const result = await r.json().catch(() => ({}));
      if (r.ok && result.ok) return;
      if (result.error === 'remote-client') {
        if (downloadAlreadyStarted) {
          setBanner('Скачивание началось. Чтобы открыть папку на этом устройстве, используйте список загрузок браузера.');
          setTimeout(() => setBanner(''), 6500);
          return;
        }
        const a = document.createElement('a');
        a.href = '/api/file/' + encodeURIComponent(id);
        a.download = fileName || 'file';
        document.body.appendChild(a); a.click(); a.remove();
        setBanner('Браузер скачивает файл на это устройство. Автоматически открыть папку загрузки и выделить скачанную копию сайт не может; для этого используйте значок загрузок браузера.');
        setTimeout(() => setBanner(''), 6500);
      } else if (result.error === 'windows only') alert('Проводник доступен, когда сервер запущен на Windows.');
      else if (result.error === 'still uploading') alert('Файл ещё загружается.');
      else alert('Не удалось открыть Проводник.');
    } catch(e){ alert('Ошибка: ' + e.message); }
  }

  let filesInitialized = false;
  function renderFiles(list){
    const ul = $('#fileList');

    const completedFiles = new Set();
    const startedFiles = new Set();
    const newlyReadyFiles = new Set();
    for (const f of list){
      const prev = state.knownFiles.get(f.id);
      if (filesInitialized && !prev && f.status === 'uploading') startedFiles.add(f.id);
      if (f.status === 'ready' && prev && prev.status === 'uploading') completedFiles.add(f.id);
      if (filesInitialized && !prev && f.status === 'ready') newlyReadyFiles.add(f.id);
    }
    for (const f of list) {
      const prev = state.knownFiles.get(f.id);
      if (f.status === 'ready' && prev && prev.status === 'uploading') {
        completedFiles.add(f.id);
      }
    }
    
    ul.textContent = '';
    const count = list.length;
    $('#fileCount').textContent = count ? '(' + count + ')' : '';
    $('#trashAll').disabled = count === 0;

    let activeUploads = 0;
    let totalPct = 0;

    if (!list.length){
      const li = document.createElement('li');
      li.className = 'empty'; li.textContent = 'Пока нет загрузок';
      ul.appendChild(li); 
    } else {
      for (const f of list.slice().reverse()){
        const li = document.createElement('li');
        li.className = 'file-item';
        li.id = 'file-' + f.id;
        
        if (completedFiles.has(f.id)) {
          li.classList.add('just-ready');
        }

        let pct = 0;
        if (f.status === 'uploading') {
          pct = Math.min(100, Math.round((f.received / (f.size || 1)) * 100));
          li.classList.add('uploading');
          li.style.setProperty('--progress', pct + '%');
          activeUploads++;
          totalPct += pct;
        }

        const thumb = makeThumb(f);
        if (f.status === 'uploading') {
          thumb.querySelector('.file-thumb-grey').style.setProperty('--progress', pct + '%');
        } else {
          thumb.querySelector('.file-thumb-grey').style.display = 'none';
        }
        li.appendChild(thumb);

        const meta = document.createElement('div'); meta.className = 'file-meta';
        const nameEl = document.createElement('span');
        nameEl.className = 'file-name link';
        nameEl.textContent = f.name;
        nameEl.title = f.name + ' — нажмите, чтобы выделить файл в Проводнике на ПК, где запущен сервер';
        nameEl.addEventListener('click', () => revealFile(f.id, f.name));

        const sub = document.createElement('div'); sub.className = 'file-sub';
        sub.textContent = fmtSize(f.size) + ' • ' + fmtTime(f.time);
        meta.append(nameEl, sub);
        li.appendChild(meta);

        if (f.status === 'uploading') {
          const pctBadge = document.createElement('div');
          pctBadge.className = 'upload-pct';
          pctBadge.textContent = pct + '%';
          li.appendChild(pctBadge);
        } else {
          const dl = document.createElement('a');
          dl.className = 'btn-dl';
          dl.href = '/api/file/' + encodeURIComponent(f.id);
          dl.setAttribute('download', f.name);
          dl.title = 'Скачать файл'; dl.textContent = '⬇';
          dl.addEventListener('click', () => {
            // Браузер не сообщает сайту фактическую папку загрузки.
            // На локальном ПК показываем в Проводнике исходный файл из хранилища сервера.
            revealFile(f.id, f.name, true);
          });
          li.appendChild(dl);

          const del = document.createElement('button');
          del.className = 'btn-del'; del.type = 'button';
          del.title = 'Удалить'; del.textContent = '✕';
          del.addEventListener('click', async () => {
            if (!confirm('Удалить «' + f.name + '»?')) return;
            try { await fetch('/api/file/' + encodeURIComponent(f.id), { method: 'DELETE' }); } catch (e) {}
            state.filesHash = ''; pollFiles();
          });
          li.appendChild(del);
        }

        ul.appendChild(li);
      }
    }

    if (completedFiles.size > 0) {
      playSound('receive');
    }
    
    for (const f of list) {
      state.knownFiles.set(f.id, f);
    }

    const headerPct = $('#uploadPct');
    const pctVal = $('#pctVal');
    if (activeUploads > 0) {
      headerPct.hidden = false;
      pctVal.textContent = Math.round(totalPct / activeUploads) + '%';
    } else {
      headerPct.hidden = true;
    }
  }

  async function pollFiles(){
    try {
      const r = await fetch('/api/files', { cache: 'no-store' });
      if (!r.ok) return;
      const list = await r.json();
      
      const hash = JSON.stringify(list.map(f => f.id + '|' + f.name + '|' + f.size + '|' + f.status + '|' + f.received));
      if (hash === state.filesHash) return;
      state.filesHash = hash;
      renderFiles(list);
    } catch (e) {}
  }

  /* ---------- загрузка ---------- */
  const queue = [];
  let uploading = false;

  function uploadOne(file, onProgress){
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      const fileId = 'f' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      xhr.open('POST', '/api/upload', true);
      xhr.setRequestHeader('X-File-Name-B64', btoa(unescape(encodeURIComponent(file.name))));
      xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name)); // fallback для старых серверов
      xhr.setRequestHeader('X-File-Type', file.type || '');
      xhr.setRequestHeader('X-File-Id', fileId);
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
      };
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300)
        ? resolve()
        : reject(new Error(xhr.responseText || ('HTTP ' + xhr.status)));
      xhr.onerror = () => reject(new Error('network'));
      xhr.send(file);
    });
  }

  async function processQueue(){
    if (uploading) return;
    uploading = true;
    const label = $('#sendProgress');
    const total = queue.length; let i = 0;
    while (queue.length){
      const file = queue.shift(); i++;
      label.textContent = 'Загрузка ' + i + '/' + total + ': ' + file.name;
      try {
        await uploadOne(file, (p) => { label.textContent = 'Загрузка ' + i + '/' + total + ': ' + file.name + ' — ' + p + '%'; });
        label.textContent = '✓ ' + file.name;
      } catch (err){
        label.textContent = '✗ ' + file.name + ' (' + err.message + ')';
        await new Promise(r => setTimeout(r, 1500));
      }
    }
    setTimeout(() => { label.textContent = ''; }, 1500);
    uploading = false;
    state.filesHash = ''; pollFiles();
  }

  function uploadAll(fileList){
    if (!fileList.length) return;
    queue.push(...fileList);
    processQueue();
  }

  filesBtn.addEventListener('click',  () => filesInput.click());
  photosInput.addEventListener('change', () => {
    if (photosInput.files.length) uploadAll(Array.from(photosInput.files));
    photosInput.value = '';
  });
  filesInput.addEventListener('change', () => {
    if (filesInput.files.length) uploadAll(Array.from(filesInput.files));
    filesInput.value = '';
  });

  ['dragenter','dragover'].forEach(ev =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); drop.classList.add('over'); }));
  ['dragleave','dragend'].forEach(ev =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); e.stopPropagation(); drop.classList.remove('over');
    uploadAll(Array.from((e.dataTransfer && e.dataTransfer.files) || []));
  });

  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => e.preventDefault());

  document.addEventListener('paste', (e) => {
    const items = Array.from((e.clipboardData && e.clipboardData.files) || []);
    if (items.length){ e.preventDefault(); uploadAll(items); }
  });
})();
</script>
</body>
</html>
